 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Image Gallery</h1>

<!-- Filters -->
<div class="filters">
  <button onclick="filterImages('all')">All</button>
  <button onclick="filterImages('nature')">Nature</button>
  <button onclick="filterImages('city')">City</button>
</div>

<!-- Gallery -->
<div class="gallery">
  <div class="gallery-item" data-category="nature"><img src="https://picsum.photos/id/1015/400/300"></div>
  <div class="gallery-item" data-category="city"><img src="https://picsum.photos/id/1011/400/300"></div>
  <div class="gallery-item" data-category="nature"><img src="https://picsum.photos/id/1018/400/300"></div>
  <div class="gallery-item" data-category="city"><img src="https://picsum.photos/id/1020/400/300"></div>
  <div class="gallery-item" data-category="nature"><img src="https://picsum.photos/id/1024/400/300"></div>
  <div class="gallery-item" data-category="city"><img src="https://picsum.photos/id/1031/400/300"></div>
  <div class="gallery-item" data-category="nature"><img src="https://picsum.photos/id/1040/400/300"></div>
  <div class="gallery-item" data-category="city"><img src="https://picsum.photos/id/1050/400/300"></div>
  <div class="gallery-item" data-category="nature"><img src="https://picsum.photos/id/1060/400/300"></div>
  <div class="gallery-item" data-category="city"><img src="https://picsum.photos/id/1070/400/300"></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
  <div class="controls">
    <button onclick="prevImage()">Prev</button>
    <button onclick="nextImage()">Next</button>
    <button onclick="closeLightbox()">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
